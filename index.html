<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оно тебе надо — аукцион вещей, в которые никто не верил</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <!-- Шапка сайта -->
    <header class="header"></header>
    <nav class="header__menu">
      <ul class="header__links-list">
        <li class="header__link-list-item header__link-list-item_no-bullit">
          <a class="header__link_no-underline">главная</a>
        </li>
        <li class="header__link-list-item">
          <a class="header__link" href="#">посмотреть лоты</a>

        <li class="header__link-list-item">

      </ul>
    </nav>

    <address class="address"></address>
    <main class="content">
      <section class="cover"></section>
      <div class="description"></div>
      <section class="lots-set">
        <h2 class="lots-title">Лоты</h2>
        <ul class="lots-list">
          <li class="auction-items">
            <a href="#" class="lots-link">
              <article class="lot"></article>
            </a>
          </li>
        </ul>
      </section>
      <section class="about">
        <div class="about-column about-column-logo">
          <div class="about-column about-column-text">
            <h2 class="about-title">ОБ АУКЦИОНЕ</h2>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <address class="footer-address-container">
        <div class="phone-box">
          <span class="contact-text">+9 999 555 5555</span>
          <span class="contact-underline"></span>
        </div>
        <div class="email-box">
          <span class="email-text">info@sobaka.ge</span>
          <span class="email-underline"></span>
        </div>
        <div class="place-text">наб. Принсенграхт 263- 265, Амстердам</div>
        <nav class="footer-nav">
          <li class="first-item-menu">
            <a href="#" class="main-page">главная</a>
          </li>
          <li class="second-item-menu">
            <a href="#" class="lots-page">посмотреть лоты</a>
            <span class="lots-page-underline"></span>
          </li>
          <li class="third-item-menu">
            <a href="#" class="about-auction">об аукционе</a>
            <span class="about-auction-underline"></span>
          </li>
          <div class="socials">
            <a href="#" class="social-link">
              <img src="images/youtube.svg" alt="YouTube" />
            </a>
            <a href="#" class="social-link">
              <img src="images/vk.svg" alt="ВКонтакте" />
            </a>
            <a href="#" class="social-link">
              <img src="images/pinterest.svg" alt="Pinterest" />
            </a>
          </div>
        </nav>
      </address>
    </footer>
